name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Compile, test, and run fixture demo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile modules
        run: >
          python -m py_compile
          twitter_etl.py
          twitter_dag.py
          dashboard.py
          streaming/twitter_stream.py
          social_signal_pipeline/__init__.py
          social_signal_pipeline/pipeline.py
          social_signal_pipeline/sources.py
          social_signal_pipeline/exports.py

      - name: Run unit tests
        run: pytest -q

      - name: Run fixture demo
        run: |
          export FIXTURE_TWEETS_PATH=examples/sample_tweets.jsonl
          export OUTPUT_CSV_PATH=outputs/refined_tweets.csv
          export OUTPUT_JSONL_PATH=outputs/enriched_tweets.jsonl
          export OUTPUT_JSON_PATH=outputs/enriched_tweets.json
          python -c "from twitter_etl import run_twitter_etl; print(run_twitter_etl())"
          test -s outputs/refined_tweets.csv
          test -s outputs/enriched_tweets.jsonl
          test -s outputs/enriched_tweets.json
