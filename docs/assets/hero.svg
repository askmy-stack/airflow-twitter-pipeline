<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Social Signal Pipeline overview</title>
  <desc id="desc">A dashboard-style preview showing tweet ingestion, AI enrichment, domain analysis, and signal outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="55%" stop-color="#15323a"/>
      <stop offset="100%" stop-color="#2d5a4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.13">
    <path d="M80 390 C260 250 360 445 540 270 C720 95 845 270 1080 120"/>
    <path d="M0 180 C220 120 310 240 500 160 C705 72 850 185 1200 60"/>
  </g>
  <text x="70" y="92" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700">Social Signal Pipeline</text>
  <text x="72" y="132" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="20">Real tweet ingestion, model-agnostic AI enrichment, and structured market/social intelligence.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="178" width="320" height="230" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="98" y="220" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Sources</text>
    <text x="98" y="260" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Twitter/X API</text>
    <text x="98" y="296" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Xquik exports</text>
    <text x="98" y="332" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Sample fixtures</text>
    <text x="98" y="368" fill="#aee6d0" font-family="Inter, Arial, sans-serif" font-size="14">Provenance preserved</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="150" width="320" height="286" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="468" y="192" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">AI Enrichment</text>
    <text x="468" y="232" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Sentiment</text>
    <text x="468" y="268" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Topics and entities</text>
    <text x="468" y="304" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Toxicity risk</text>
    <text x="468" y="340" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Intent and signal</text>
    <rect x="468" y="370" width="226" height="34" rx="17" fill="#30c48d" fill-opacity="0.22" stroke="#84f0bf"/>
    <text x="486" y="392" fill="#c9ffe2" font-family="Inter, Arial, sans-serif" font-size="14">Provider-neutral schema</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="810" y="178" width="320" height="230" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="838" y="220" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Outputs</text>
    <text x="838" y="260" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">JSONL canonical records</text>
    <text x="838" y="296" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Grouped JSON export</text>
    <text x="838" y="332" fill="#d8efe7" font-family="Inter, Arial, sans-serif" font-size="16">Analytics-ready CSV</text>
    <text x="838" y="368" fill="#aee6d0" font-family="Inter, Arial, sans-serif" font-size="14">Dashboard + Airflow</text>
  </g>
  <path d="M390 292 H440" stroke="#84f0bf" stroke-width="4" stroke-linecap="round"/>
  <path d="M760 292 H810" stroke="#84f0bf" stroke-width="4" stroke-linecap="round"/>
</svg>
